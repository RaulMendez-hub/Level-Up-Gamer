<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header>
        <div id="header">
            <div class="contact">
                <a href="">+569 669 90 493</a>
                <span>Leveluptienda@gmail.com</span>
            </div>
            <div class="location">
                <span>San Bernardo, Santiago Chile</span>
            </div>
        </div>
        <!--Navbar-->

        <nav id="navbar">
            <div class="logo">
                <img src="/image/logo.png" alt="logo">
            </div>
            <div class="links mx-auto">
                <a class="link" href="/index.html">Inicio</a>
                <a class="link" href="#">Productos</a>
                <a class="link" href="#">Eventos</a>
                

            </div>
            <div class="login">
                <a class="link" href="#">Iniciar Sesion</a>
                <a class="link" href="#">Registrarse</a>

            </div>
        </nav>


    </header>
    
    <main>
        <!-- Carousel   -->
        
        <div id="carousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./image/Wolverine.webp" class="d-flex w-50 mx-auto" alt="Wolverine">
            </div>
            <div class="carousel-item">
                <img src="./image/gta6.webp" class="d-flex w-50 mx-auto" alt="GTA 6">
            </div>
            <div class="carousel-item">
                <img src="./image/notebookcarousel.jpeg" class="d-flex w-50 mx-auto" alt="PC">
            </div>
            <div class="carousel-item">
                <img src="./image/pc.jpeg" class="d-flex w-50 mx-auto" alt="PC">
            </div>
            
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
        
        
        </div>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
